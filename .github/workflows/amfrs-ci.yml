# Fast unit tests for amfrs_env / crowd_nav.reward_search (no GPU, no Groq network).
name: amfrs-env-ci

on:
  push:
    paths:
      - "amfrs_env/**"
      - ".github/workflows/amfrs-ci.yml"
  pull_request:
    paths:
      - "amfrs_env/**"
      - ".github/workflows/amfrs-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amfrs_env

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned deps (CPU smoke subset)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_pinned.txt
          pip install torch==1.12.1+cpu -f https://download.pytorch.org/whl/torch_stable.html || pip install torch==1.12.1

      - name: Fast tests (exclude slow simulator collect)
        run: |
          python -m pytest crowd_nav/reward_search/tests crowd_nav/reward_search/amfrs/tests -m "not slow" -q
